version: 2

before:
  hooks: []

env:
  - CGO_ENABLED=0
  - GO111MODULE=on

snapshot:
  version_template: "SNAPSHOT-{{.ShortCommit}}"

builds:
  - id: common-server
    dir: common-server
    main: cmd/server/server.go
    binary: common-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: secret-manager
    dir: secret-manager
    main: cmd/server/server.go
    binary: secret-manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: file-manager
    dir: file-manager
    main: cmd/server/server.go
    binary: file-manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: approval
    dir: approval
    main: cmd/main.go
    binary: approval
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: gateway
    dir: gateway
    main: cmd/main.go
    binary: gateway
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: identity
    dir: identity
    main: cmd/main.go
    binary: identity
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: organization
    dir: organization
    main: cmd/main.go
    binary: organization
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: admin
    dir: admin
    main: cmd/main.go
    binary: admin
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: application
    dir: application
    main: cmd/main.go
    binary: application
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: api
    dir: api
    main: cmd/main.go
    binary: api
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: rover
    dir: rover
    main: cmd/main.go
    binary: rover
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: controlplane-api
    dir: controlplane-api
    main: cmd/main.go
    binary: controlplane-api
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: rover-server
    dir: rover-server
    main: cmd/main.go
    binary: rover-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: rover-ctl
    dir: rover-ctl
    main: main.go
    binary: roverctl
    ldflags:
      - -X 'main.version={{.Version}}'
      - -X 'main.buildTime={{.Date}}'
      - -X 'main.gitCommit={{.FullCommit}}'
    goos:
      - linux
      - windows # only for rover-ctl
    goarch:
      - amd64
  - id: event
    dir: event
    main: cmd/main.go
    binary: event
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: pubsub
    dir: pubsub
    main: cmd/main.go
    binary: pubsub
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: discovery-server
    dir: discovery-server
    main: cmd/main.go
    binary: discovery-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: notification
    dir: notification
    main: cmd/main.go
    binary: notification
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: projector
    dir: projector
    main: main.go
    binary: projector
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: rover-ctl
    ids: [rover-ctl]
    formats: [tar.gz]
    name_template: >-
      roverctl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  header: >-
    # 🚀 Release {{ .Version }}
  footer: >-

    ---

    ✨🎉

sboms:
  - artifacts: archive

kos: 
  - id: common-server
    build: common-server
    main: .
    working_dir: common-server/cmd/server
    repositories:
      - ghcr.io/telekom/controlplane/common-server
    labels:
      org.opencontainers.image.authors: "Deutsche Telekom IT GmbH <opensource@telekom.de>"
