default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args: []
  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
      - id: reuse-lint-file
        stages:
          - pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.25.1
    hooks:
      - id: gitleaks
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: validate-rules
        name: validate agent rules
        entry: python3 .agents/skills/code-auditor/scripts/validate_rules.py
        language: system
        pass_filenames: false
        files: ^\.agents/(rules/.*\.md|auditignore)$
        stages:
          - pre-commit
      - id: selftest-rules-static
        name: rule selftest (no model)
        entry: python3 .agents/skills/code-auditor/scripts/selftest_rules.py --static
        language: system
        pass_filenames: false
        files: ^\.agents/rules/.*\.md$
        stages:
          - pre-commit
      - id: sync-judges
        name: judges match the harness agents
        entry: python3 .agents/skills/code-auditor/scripts/sync_judges.py --check
        language: system
        pass_filenames: false
        files: ^(\.agents/(judges\.yaml|skills/code-auditor/(persona/README\.md|scripts/(sync_judges\.py|auditlib/judges\.py)))|\.opencode/agents/.*|\.claude/agents/.*|\.github/agents/.*)$
        stages:
          - pre-commit
      - id: audit-gate
        name: audit gate
        entry: python3 .agents/skills/code-auditor/scripts/audit_gate.py --mode staged --fail-on CRITICAL
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
