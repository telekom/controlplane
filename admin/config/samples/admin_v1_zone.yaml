apiVersion: admin.cp.ei.telekom.de/v1
kind: Zone
metadata:
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/managed-by: kustomize
    cp.ei.telekom.de/environment: test-env
  name: zone-a
  namespace: default
spec:
  # zone-level features
  features:
    - name: BasicAuth
      enabled: true
  visibility: Enterprise
  identityProviders:
    - name: primary
      admin:
        url: https://identity.example.com/auth/admin/realms
        clientId: admin-cli
        userName: admin
        password: change-me
      issuerHostname: identity.example.com
      # tokenUrl is discovered from each generated realm issuer when omitted.
      secretRotation:
        enabled: true
        gracePeriod: 168h
        expirationPeriod: 2160h
        notificationThresholds:
          - before: 720h
          - before: 168h
            repeat: 24h
  gateways:
    - name: standard
      admin:
        identityProviderRef: primary
        url: https://gateway-admin.example.com/admin-api
        clientId: gateway-admin
    - name: ai
      admin:
        identityProviderRef: primary
        url: https://ai-gateway-admin.example.com/admin-api
        clientId: ai-gateway-admin
  presets:
    - name: default
      default: true
      gatewayRef: standard
      identityProviderRef: primary
      urls:
        - hostname: gateway.example.com
          scheme: https
          basePath: /
          hidden: false
    - name: consumer-failover
      gatewayRef: standard
      identityProviderRef: primary
      tokenUrl: https://dtc.identity.example.com/auth/realms/default/protocol/openid-connect/token
      urls:
        - hostname: dtc.gateway.example.com
          scheme: https
          basePath: /
          hidden: false
      features:
        - name: ConsumerFailover
          enabled: true
    - name: ai
      gatewayRef: ai
      identityProviderRef: primary
      urls:
        - hostname: ai.gateway.example.com
          scheme: https
          basePath: /
          hidden: false
      features:
        - name: AiGateway
          enabled: true
  redis:
    host: redis-master.default.svc.cluster.local
    port: 6379
    password: change-me
    enableTLS: true
  managedRoutes:
    routes:
      - name: team-api
        path: /team-api
        url: https://team-api.default.svc.cluster.local
        type: TeamAPI
  permissions:
    apiBasePath: /eni/chevron/v2/permission
    consoleUrl: https://permissions.example.com
  externalIdPolicies:
    - scheme: psi
      required: true
      pattern: "^[0-9]{8}$"
