# Project one audience-bound ServiceAccount token per internal upstream.
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: cpapi-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 600
            audience: controlplane-api
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: cpapi-token
    mountPath: /var/run/secrets/cpapi
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: rover-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 600
            audience: rover-server
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: rover-token
    mountPath: /var/run/secrets/rover
    readOnly: true
