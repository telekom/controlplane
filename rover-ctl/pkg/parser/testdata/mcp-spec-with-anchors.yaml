basePath: /team/anchored-assistant
sharedToolOptions: &mcp_tool_defaults_anchor
  description: Process the provided text
  inputSchema: &mcp_text_schema_anchor
    type: object
    properties:
      text:
        type: string
    required:
      - text
tools:
  - <<: *mcp_tool_defaults_anchor
    name: summarize
  - name: translate
    description: Translate the provided text
    inputSchema: *mcp_text_schema_anchor
