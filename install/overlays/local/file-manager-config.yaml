backend:
  type: buckets
  endpoint: rustfs:9000
  bucket_name: controlplane-files
  insecure_skip_tls: true

# Auth: uses the default internal k8s listener (:8443, audience file-manager,
# in-cluster issuer, empty accessConfig = any authenticated in-cluster SA).
# To restrict, add a listeners.internal.k8s.accessConfig allow-list.
