apiVersion: notification.cp.ei.telekom.de/v1
kind: NotificationTemplate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
  name: approvalexpiration--listen-consumer--reminder--decider--mail
spec:
  purpose: approvalexpiration--listen-consumer--reminder--decider
  channelType: Email
  subjectTemplate: '[{{.environment}}][Approval-Reminder] The listening approval for the traffic of your application {{.decider_application}} to Api {{.apibasepath}} for team {{.requester_team}}({{.requester_group}}) will expire at {{.expiration_date}}'
  template: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Approval Expiration Notification - Control Plane</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                color: #333;
                background-color: #f9f9f9;
                line-height: 1.6;
            }

            .content {
                max-width: 700px;
                margin: auto;
                background-color: #fff;
                padding: 20px;
                border-top: 10px solid #e20074;
                border-bottom: 10px solid #e20074;
            }

            h1, h2 {
                margin: 0 0 10px;
            }

            h2 span.highlight {
                font-style: italic;
                color: #e20074;
            }

            .header-table td {
                vertical-align: middle;
            }

            a {
                color: #e20074;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
    <div class="content">
        <table class="header-table" width="100%">
            <tr>
                <td width="120" style="text-align: center;">
                    <img width="120" height="120" src="https://raw.githubusercontent.com/telekom/controlplane/main/docs/static/img/eni-tardis-small.png" alt="TARDIS Logo">
                </td>
                <td>
                    <div style="margin-left: 24px;">
                        <h2 style="color:#e20074; margin:0 0 4px;">Control Plane</h2>
                        <h1 style="margin:0;">Approval Expiration Notification</h1>
                    </div>
                </td>
            </tr>
        </table>

        <!-- Summary box -->
        <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin:20px 0; border-left:4px solid #e20074; background:#fdf0f5;">
            <tr>
                <td style="padding:12px 16px;">
                    <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse;">
                        <tr>
                            <td style="padding:4px 0;"><strong>Environment:</strong> {{.environment}}</td>
                        </tr>
                        <tr>
                            <td style="padding:4px 0;"><strong>Api:</strong> <span style="color:#e20074; font-weight:bold;">{{.apibasepath}}</span></td>
                        </tr>
                        <tr>
                            <td style="padding:4px 0;"><strong>Consumer:</strong> {{.consumer}}</td>
                        </tr>
                        <tr>
                            <td style="padding:4px 0;"><strong>Provider:</strong> {{.provider}}</td>
                        </tr>
                        <tr>
                            <td style="padding:4px 0;"><strong>Current status:</strong> {{.state_new}}</td>
                        </tr>
                        <tr>
                            <td style="padding:4px 0;"><strong>Expires:</strong> {{.expiration_date}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <p>Dear team {{.decider_team}},</p>

        <p>
            The listening approval you granted for the traffic of your application <strong>{{.decider_application}}</strong> to the Api <strong>{{.apibasepath}}</strong> of provider <strong>{{.provider}}</strong> will expire {{if eq .days_remaining "0"}}within the next 24 hours{{else}}in <strong>{{.days_remaining}}</strong> day(s){{end}} on <strong>{{.expiration_date}}</strong>.
        </p>

        <p>
            {{if eq .state_new "Suspended"}}The listening is currently suspended, so application <strong>{{.requester_application}}</strong> of team <strong>{{.requester_team}}</strong> from group <strong>{{.requester_group}}</strong> cannot listen to this traffic until you grant the approval again. The approval itself still expires on <strong>{{.expiration_date}}</strong>.{{else}}Once it has expired, application <strong>{{.requester_application}}</strong> of team <strong>{{.requester_team}}</strong> from group <strong>{{.requester_group}}</strong> can no longer listen to this traffic until you grant the approval again.{{end}}
        </p>

        <p>You can manage the listening via your platform portal.</p>

        <!-- Listener details table -->
        <h3>Listener Details</h3>
        <table cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin:8px 0 16px;">
            <tr style="background:#f5f5f5;">
                <td style="padding:8px 12px; font-weight:bold; width:140px; border-bottom:1px solid #eee;">Api</td>
                <td style="padding:8px 12px; border-bottom:1px solid #eee;">{{.apibasepath}}</td>
            </tr>
            <tr>
                <td style="padding:8px 12px; font-weight:bold; border-bottom:1px solid #eee;">Consumer</td>
                <td style="padding:8px 12px; border-bottom:1px solid #eee;">{{.consumer}} (team ID {{.consumerteam}})</td>
            </tr>
            <tr style="background:#f5f5f5;">
                <td style="padding:8px 12px; font-weight:bold; border-bottom:1px solid #eee;">Provider</td>
                <td style="padding:8px 12px; border-bottom:1px solid #eee;">{{.provider}} (team ID {{.providerteam}})</td>
            </tr>
            <tr>
                <td style="padding:8px 12px; font-weight:bold; border-bottom:1px solid #eee;">Listening application</td>
                <td style="padding:8px 12px; border-bottom:1px solid #eee;">{{.requester_application}}</td>
            </tr>
            <tr style="background:#f5f5f5;">
                <td style="padding:8px 12px; font-weight:bold; border-bottom:1px solid #eee;">Team</td>
                <td style="padding:8px 12px; border-bottom:1px solid #eee;">{{.requester_team}}</td>
            </tr>
            <tr>
                <td style="padding:8px 12px; font-weight:bold;">Group</td>
                <td style="padding:8px 12px;">{{.requester_group}}</td>
            </tr>
        </table>

        <!-- Footer -->
        <hr style="border:none; border-top:1px solid #ddd; margin:24px 0;">
        <p style="margin:0;">Best regards,<br><strong>Control Plane Team</strong></p>
        <p style="color:#999; font-size:12px; margin-top:12px;">This is an automated notification. Please do not reply to this email.</p>
    </div>
    </body>
    </html>
