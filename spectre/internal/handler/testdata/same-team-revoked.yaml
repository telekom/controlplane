#
# Phase 0 upgrade snapshot: same-team, revoked (Suspended), Auto strategy.
# Baseline ref: feat/spectre @ b2186921 (pre-dual-gate).
#
# This fixture represents the complete persisted-state graph for a Listener
# whose Approval was initially Auto-granted and then suspended by the provider.
# The Listener status reflects the denied state. The SpectreApplication remains
# but its child resources (routes, publishers) are assumed already drained by
# the handler when the Approval was denied.
#
# Strategy is Auto (same team) per the actual workflow. The revocation
# transition is Granted -> Suspended, which is a supported transition in the
# Auto FSM. The fixture intentionally does NOT change to Simple strategy.
---
apiVersion: spectre.cp.ei.telekom.de/v1
kind: Listener
metadata:
  name: fixture-listener-revoked
  namespace: fixture-team
  uid: uid-listener-revoked
  labels:
    cp.ei.telekom.de/environment: fixture-env
spec:
  consumer:
    apiVersion: application.cp.ei.telekom.de/v1
    kind: Application
    name: consumer-app
    namespace: fixture-team
  provider:
    apiVersion: application.cp.ei.telekom.de/v1
    kind: Application
    name: provider-app
    namespace: fixture-team
  application:
    name: sa-consumer-app-revoked
    namespace: fixture-team
  apiListener:
    apiBasePath: /api/v1/fixture
status:
  conditions:
    - type: Ready
      status: "False"
      reason: AccessDenied
      message: "Approval has been denied"
      lastTransitionTime: "2025-01-01T00:00:00Z"
    - type: Processing
      status: "False"
      reason: Done
      message: "Approval has been denied"
      lastTransitionTime: "2025-01-01T00:00:00Z"
  providerApproval:
    name: listener--fixture-listener-revoked
    namespace: fixture-team
---
apiVersion: spectre.cp.ei.telekom.de/v1
kind: SpectreApplication
metadata:
  name: sa-consumer-app-revoked
  namespace: fixture-team
  uid: uid-spectreapp-revoked
  labels:
    cp.ei.telekom.de/environment: fixture-env
spec:
  application:
    apiVersion: application.cp.ei.telekom.de/v1
    kind: Application
    name: consumer-app
    namespace: fixture-team
  deliveryType: server_sent_event
status:
  id: "fixture-team--consumer-app"
---
apiVersion: approval.cp.ei.telekom.de/v1
kind: Approval
metadata:
  name: listener--fixture-listener-revoked
  namespace: fixture-team
  uid: uid-approval-revoked
  labels:
    cp.ei.telekom.de/environment: fixture-env
  ownerReferences:
    - apiVersion: spectre.cp.ei.telekom.de/v1
      kind: Listener
      name: fixture-listener-revoked
      uid: uid-listener-revoked
      controller: true
      blockOwnerDeletion: true
spec:
  action: listen-provider
  target:
    apiVersion: spectre.cp.ei.telekom.de/v1
    kind: Listener
    name: fixture-listener-revoked
    namespace: fixture-team
    uid: uid-listener-revoked
  requester:
    teamName: "fixture-team"
    teamEmail: "fixture@test.com"
    applicationRef:
      apiVersion: application.cp.ei.telekom.de/v1
      kind: Application
      name: consumer-app
      namespace: fixture-team
  decider:
    teamName: "fixture-team"
    teamEmail: "fixture@test.com"
    applicationRef:
      apiVersion: application.cp.ei.telekom.de/v1
      kind: Application
      name: provider-app
      namespace: fixture-team
  decisions:
    - name: System
      comment: "Auto-approved: The approval strategy does not require manual review."
      resultingState: Granted
  strategy: Auto
  state: Suspended
  approvedRequest:
    name: fixture-listener-revoked--fixture-ar-hash
    namespace: fixture-team
status:
  lastState: Granted
---
apiVersion: approval.cp.ei.telekom.de/v1
kind: ApprovalRequest
metadata:
  name: fixture-listener-revoked--fixture-ar-hash
  namespace: fixture-team
  uid: uid-ar-revoked
  labels:
    cp.ei.telekom.de/environment: fixture-env
  ownerReferences:
    - apiVersion: spectre.cp.ei.telekom.de/v1
      kind: Listener
      name: fixture-listener-revoked
      uid: uid-listener-revoked
      controller: true
      blockOwnerDeletion: true
spec:
  action: listen-provider
  target:
    apiVersion: spectre.cp.ei.telekom.de/v1
    kind: Listener
    name: fixture-listener-revoked
    namespace: fixture-team
    uid: uid-listener-revoked
  requester:
    teamName: "fixture-team"
    teamEmail: "fixture@test.com"
    applicationRef:
      apiVersion: application.cp.ei.telekom.de/v1
      kind: Application
      name: consumer-app
      namespace: fixture-team
  decider:
    teamName: "fixture-team"
    teamEmail: "fixture@test.com"
    applicationRef:
      apiVersion: application.cp.ei.telekom.de/v1
      kind: Application
      name: provider-app
      namespace: fixture-team
  decisions:
    - name: System
      comment: "Auto-approved: The approval strategy does not require manual review."
      resultingState: Granted
  strategy: Auto
  state: Granted
status:
  lastState: Pending
  approval:
    name: listener--fixture-listener-revoked
    namespace: fixture-team
