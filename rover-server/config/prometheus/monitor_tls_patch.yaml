# Patch for Prometheus ServiceMonitor to enable secure TLS verification
# using the cert-manager-managed serving certificate (rover-server-cert).
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
    serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
    insecureSkipVerify: false
    ca:
      secret:
        name: rover-server-cert
        key: ca.crt
    cert:
      secret:
        name: rover-server-cert
        key: tls.crt
    keySecret:
      name: rover-server-cert
      key: tls.key
