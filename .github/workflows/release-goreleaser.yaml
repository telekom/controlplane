# Runs GoReleaser for an already-existing release tag: builds binaries for
# all modules, builds+pushes their container images to GHCR (via GoReleaser's
# `kos` pipe), signs artifacts with cosign, generates SBOMs with syft, and
# publishes the GitHub Release itself - including release notes, generated
# by GoReleaser's own `changelog:`/`release:` config in .goreleaser.yaml
# (commits since the previous tag), not by semantic-release.
#
# Invoked (via workflow_call) by release-publish.yaml, which also wires its
# `version` output into the downstream Artifactory-mirroring and
# roverctl-combined-image jobs.
#
# Also directly runnable via workflow_dispatch (Actions tab > "Release
# GoReleaser" > Run workflow, supplying the existing release tag) to re-run
# just this job, e.g. after fixing a transient GHCR/registry outage, without
# re-running semantic-release or re-triggering the rest of
# release-publish.yaml.
name: "Release GoReleaser"

on:
  workflow_call:
    outputs:
      version:
        description: "The released version (tag with leading 'v' stripped), e.g. 1.2.3"
        value: ${{ jobs.goreleaser.outputs.version }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)run GoReleaser for, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the GitHub release
      packages: write # to push module images to GHCR
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag input
        # Only relevant for workflow_dispatch: workflow_call always supplies
        # the tag via the triggering push event, not this input. Rejects
        # anything that isn't a `v<semver>` release tag (e.g. "main" or an
        # arbitrary branch name) up front, before it's used as a checkout
        # ref or emitted as the release version below - `actions/checkout`
        # would otherwise happily check out a branch and silently run
        # GoReleaser against a non-release ref.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a valid release tag (expected format: v<semver>, e.g. v1.2.3)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On workflow_call (tag push), the default ref is already the
          # pushed tag. On workflow_dispatch, the run's ref defaults to the
          # branch the workflow was launched from - not a release tag - so
          # explicitly check out the requested (and now validated) tag
          # input instead.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # full history, needed for GoReleaser's changelog generation

      - name: Determine release version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # `TAG` is either the explicit workflow_dispatch input or the
          # pushed tag (e.g. "v1.2.3"); GoReleaser's own {{.Version}} (used
          # in image labels/tags below) strips the leading "v" the same way.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
