# Runs GoReleaser for a release tag just cut by release.yaml: builds binaries
# for all modules, builds+pushes their container images to GHCR (via
# GoReleaser's `kos` pipe), signs artifacts with cosign, generates SBOMs with
# syft, and publishes the GitHub Release using semantic-release's release
# notes. Only invoked (via workflow_call) by release.yaml.
name: "Release GoReleaser"

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3"
        required: true
        type: string
      release-notes:
        description: "Release notes generated by semantic-release, used as the GitHub Release body"
        required: true
        type: string

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the GitHub release
      packages: write # to push module images to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release commit is created by semantic-release after this run
          # started, so check out the tag rather than the triggering SHA.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --release-notes ${{ runner.temp }}/release-notes.md --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
