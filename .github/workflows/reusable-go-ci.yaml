name: "Go CI"

on:
  workflow_call:
    inputs:
      module:
        description: "The Go module to process"
        required: true
        type: string
      name:
        description: "Name of the module for display purposes"
        required: true
        type: string
      run_check_generated_files:
        description: "Set to true to run checks for generated files"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Set to true to run unit tests and code coverage"
        required: false
        type: boolean
        default: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
      allow_tests_failure:
        description: "Set to true to allow tests to fail without failing the job"
        required: false
        type: boolean
        default: false
      run_build_image:
        description: "Set to true to build the container image using Ko"
        required: false
        type: boolean
        default: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
      ko_build_path:
        description: "Path to the main package for ko build (e.g., cmd/main.go or ./cmd/server)"
        required: false
        type: string
        default: "cmd/main.go"
      run_vulnerability_check:
        description: "Set to true to run govulncheck"
        required: false
        type: boolean
        default: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
      run_code_analysis:
        description: "Set to true to run CodeQL analysis"
        required: false
        type: boolean
        default: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
      run_lint:
        description: "Set to true to run golangci-lint"
        required: false
        type: boolean
        default: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
      lint_fail_on_issues:
        description: "Set to true to fail the build when golangci-lint finds issues"
        required: false
        type: boolean
        default: false
      github_repository:
        description: "GitHub repository (owner/repo), e.g., github.repository. Required if run_build_image is true."
        required: false
        type: string
        default: ${{ github.repository }}
      github_ref:
        description: "Full GitHub ref (e.g., github.ref). Required if run_build_image is true."
        required: false
        type: string
        default: ${{ github.ref }}
      container_registry:
        description: "Container registry HOST ONLY (no path), e.g., ghcr.io or artifactory.example.com. Used for docker/login-action and Trivy's registry auth. When set to a non-GHCR registry, registry_username/registry_password secrets are required for login."
        required: false
        type: string
        default: "ghcr.io"
      image_repository:
        description: "Optional full override for the KO_DOCKER_REPO image path (registry host + full repo path), bypassing the default '<container_registry>/<github_repository>/<name>' convention used for GHCR. Use this when the target registry's path structure doesn't match GHCR's org/repo/module layout (e.g. an internal Artifactory registry with a different path convention). Leave empty to use the default convention."
        required: false
        type: string
        default: ""
      base_image:
        description: "Optional base image reference (registry/repo:tag) to use instead of the default in .ko.yaml. Passed to ko as KO_DEFAULTBASEIMAGE. Leave empty to use the default from .ko.yaml."
        required: false
        type: string
        default: ""
      image_tags:
        description: "Comma-separated list of tags to apply to the built image. If empty, GITHUB_HEAD_REF_SLUG or latest will be used."
        required: false
        type: string
        default: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      coverage_threshold:
        description: "Minimum coverage percentage required. Set to 0 to disable."
        required: false
        type: number
        default: 70

    secrets:
      registry_username:
        description: "Username for logging in to container_registry, when it is not ghcr.io (which uses the built-in GITHUB_TOKEN keychain automatically). Also used by Trivy to pull the built image for scanning."
        required: false
      registry_password:
        description: "Password/token for logging in to container_registry, when it is not ghcr.io. Also used by Trivy to pull the built image for scanning."
        required: false

    outputs:
      image_digest:
        description: "Image digest from the build image step"
        value: ${{ jobs.build.outputs.image_digest }}
      image_repository:
        description: "The effective image repository (registry host + path) the built image was pushed to"
        value: ${{ jobs.build.outputs.image_repository }}

permissions:
  contents: read

jobs:
  static_checks:
    name: "Static Checks for ${{ inputs.name }}"
    if: ${{ inputs.run_lint || inputs.run_check_generated_files }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.run_code_analysis && 0 || 1 }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.module }}/go.mod"
          cache: false # Using a separate cache step

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Check Generated Files
        if: ${{ inputs.run_check_generated_files }}
        shell: bash
        working-directory: ${{ inputs.module }}
        run: |
          make manifests
          make generate
          git diff --exit-code -- . ':!go.sum' ':!go.mod'

      - name: Run golangci-lint
        if: ${{ inputs.run_lint }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: ${{ inputs.module }}
          args: --timeout 5m --issues-exit-code=${{ inputs.lint_fail_on_issues && '1' || '0' }} --config ${{ github.workspace }}/.golangci.yml

  tests:
    name: "Tests & Coverage for ${{ inputs.name }}"
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      test_reports_artifact_id: ${{ steps.upload_test_reports_artifact_step.outputs.artifact-id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.run_code_analysis && 0 || 1 }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.module }}/go.mod"
          cache: false # Using a separate cache step

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0 # h1:+Lh454O9mu9AMG1APV4o0y7oDYKyik/3kBOiCqiEpRo=

      - name: Build and test module
        shell: bash
        working-directory: ${{ inputs.module }}
        env:
          ENVTEST_K8S_VERSION: "1.32.0"
        run: make test
        continue-on-error: ${{ inputs.allow_tests_failure }}

      - name: Coverage summary
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ inputs.module }}
        run: |
          if [ -f cover.out ]; then
            total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}')
            echo "**Coverage for ${{ inputs.name }}:** ${total}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check coverage threshold
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ inputs.module }}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          if [ ! -f cover.out ]; then
            echo "::warning::No coverage file found"
            exit 0
          fi
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          if [ "$(echo "${total} < ${COVERAGE_THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload test reports
        id: upload_test_reports_artifact_step
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-test-report
          path: |
            ${{ inputs.module }}/cover.out
            ${{ inputs.module }}/junit.xml
            ${{ inputs.module }}/**/ginkgo-junit.xml
            ${{ inputs.module }}/gotest.log

      - name: Publish test report
        if: ${{ always() && (github.event_name == 'pull_request') }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        continue-on-error: ${{ inputs.allow_tests_failure }}
        with:
          name: "Test Results (${{ inputs.name }})"
          path: "${{ inputs.module }}/**/ginkgo-junit.xml,${{ inputs.module }}/junit.xml"
          reporter: java-junit

  source_scan:
    name: "Source Vulnerability Scan for ${{ inputs.name }}"
    if: ${{ inputs.run_vulnerability_check }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.run_code_analysis && 0 || 1 }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.module }}/go.mod"
          cache: false

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # unreleased, includes fix for golang/go#75908
        with:
          go-package: ./...
          work-dir: ${{ inputs.module }}

  codeql:
    name: "CodeQL Analysis for ${{ inputs.name }}"
    if: ${{ inputs.run_code_analysis }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CodeQL requires full history

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.module }}/go.mod"
          cache: false

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go
          build-mode: manual # Set to manual as we provide a build step

      - name: Build module for CodeQL
        shell: bash
        working-directory: ${{ inputs.module }}
        run: |
          echo "Attempting to build ${{ inputs.name }} for CodeQL analysis..."
          if [ -f go.mod ]; then
            echo "Found go.mod. Running go build ./..."
            go build ./...
          elif [ -f Makefile ] && grep -q -E "^build[:[:space:]]" Makefile; then
            echo "Found Makefile with build target. Running make build..."
            make build
          else
            echo "WARNING: No Makefile with a 'build' target or go.mod found in ${{ inputs.name }}. CodeQL may not analyze effectively."
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:go/${{ inputs.name }}"

  build:
    name: "Build Image for ${{ inputs.name }}"
    if: ${{ inputs.run_build_image && (needs.static_checks.result != 'failure') && (needs.tests.result != 'failure') }}
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build_image_ko_step.outputs.digest }}
      repo_lower: ${{ steps.repo_lower.outputs.repo }}
      image_repository: ${{ steps.resolve_image_repository.outputs.image_repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.run_code_analysis && 0 || 1 }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.module }}/go.mod"
          cache: false

      - name: Restore Go Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Setup Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Inject slug vars
        uses: rlespinasse/github-slug-action@e6f261660910b273384c5c42b17a0217881b217a # v5.6.0

      - name: Convert repository to lowercase
        id: repo_lower
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ inputs.github_repository }}/${{ inputs.name }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Resolve effective image repository
        id: resolve_image_repository
        shell: bash
        run: |
          if [ -n "${{ inputs.image_repository }}" ]; then
            IMAGE_REPOSITORY="${{ inputs.image_repository }}"
          else
            IMAGE_REPOSITORY="${{ inputs.container_registry }}/${{ steps.repo_lower.outputs.repo }}"
          fi
          echo "image_repository=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        # ghcr.io is authenticated automatically by ko's built-in GitHub
        # Actions keychain (using the ambient GITHUB_TOKEN), so this step is
        # skipped for the default registry. Any other registry (e.g. an
        # internal Artifactory) needs an explicit login using the
        # registry_username/registry_password secrets.
        if: ${{ inputs.container_registry != 'ghcr.io' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.container_registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build and Push Image with Ko
        id: build_image_ko_step
        shell: bash
        working-directory: ${{ inputs.module }}
        env:
          KO_DOCKER_REPO: ${{ steps.resolve_image_repository.outputs.image_repository }}
          KO_CONFIG_PATH: ${{ github.workspace }}/.ko.yaml
          KO_DEFAULTBASEIMAGE: ${{ inputs.base_image }}
        run: |
          if [ -z "${{ inputs.github_repository }}" ] || [ -z "${{ inputs.github_ref }}" ]; then
            echo "Error: github_repository and github_ref inputs are required when run_build_image is true."
            exit 1
          fi

          # Unlike goreleaser's `kos` pipe (which embeds ko as a library and
          # ignores this env var), the `ko` CLI invoked directly below does
          # honor KO_DEFAULTBASEIMAGE.
          # An empty value is safely ignored by ko, falling back to
          # KO_CONFIG_PATH's defaultBaseImage.
          if [ -n "${KO_DEFAULTBASEIMAGE}" ]; then
            echo "Using custom KO_DEFAULTBASEIMAGE: ${KO_DEFAULTBASEIMAGE}"
          fi

          effective_tags=""
          if [ -n "${{ inputs.image_tags }}" ]; then
            effective_tags="${{ inputs.image_tags }}"
          else
            effective_tags="${GITHUB_HEAD_REF_SLUG:-latest}"
          fi

          echo "Building with tags: $effective_tags"
          echo "Using KO_DOCKER_REPO: ${KO_DOCKER_REPO}"
          export VERSION=$(git describe --tags --always --dirty || echo 'develop')
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          output=$(ko build ${{ inputs.ko_build_path }} --bare --tags "$effective_tags")
          echo "Ko output: $output"
          digest=$(echo "$output" | grep -o 'sha256:[a-f0-9]\{64\}')
          echo "digest=$digest" >> $GITHUB_OUTPUT
          echo "image_ref=${KO_DOCKER_REPO}@${digest}" >> $GITHUB_OUTPUT

  image_scan:
    name: "Image Vulnerability Scan for ${{ inputs.name }}"
    if: ${{ inputs.run_build_image && needs.build.result == 'success' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # No checkout or Go setup needed if only running Trivy on a remote image.
      # For ghcr.io, Trivy uses the ambient GITHUB_TOKEN automatically; other
      # registries (e.g. an internal Artifactory) need explicit credentials,
      # since this job runs independently of the `build` job's login step.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ inputs.container_registry != 'ghcr.io' && secrets.registry_username || '' }}
          TRIVY_PASSWORD: ${{ inputs.container_registry != 'ghcr.io' && secrets.registry_password || '' }}
        with:
          image-ref: ${{ needs.build.outputs.image_repository }}@${{ needs.build.outputs.image_digest }}
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
