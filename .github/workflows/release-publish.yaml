# Publishes everything for a release that release.yaml already cut:
# GoReleaser build+push (own workflow, see release-goreleaser.yaml), mirrors
# those images to the internal Artifactory registry, and assembles the
# combined (bash/jq/yq) roverctl image.
#
# Triggered by the `v*` tag push that release.yaml's semantic-release step
# produces. Everything here is a pure function of an already-existing tag,
# so it's safe to re-run (Actions > this run > "Re-run failed jobs") if e.g.
# the Artifactory mirroring flakes, without cutting a new release.
#
# SECURITY: this workflow triggers on *any* push of a `v*` tag and has write
# access to GHCR/GitHub Releases plus the Artifactory push credentials -
# without a guard, anyone able to push a matching tag could get arbitrary
# checked-out code published under a release tag, or overwrite existing
# release image tags. The `guard` job below restricts execution to tags
# pushed by the same release bot (GitHub App) that release.yaml uses, by
# comparing `github.actor` (the authenticated pusher, not attacker-
# controllable commit metadata) against that App's bot identity.
# Defense in depth: also configure a GitHub tag protection rule for `v*`
# (Settings > Tags > New rule) restricting who may create/push matching
# tags at all - the in-workflow guard alone cannot prevent a trusted-but-
# compromised token from pushing a malicious tag.
name: Release Publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: Verify Trusted Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release bot identity
        id: bot_identity
        # Reuses the same GitHub App credentials release.yaml uses to push
        # the tag - only to read the App's own bot login (`app-slug` +
        # "[bot]"), not to grant this job any write access.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Verify tag was pushed by the release bot
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          APP_SLUG: ${{ steps.bot_identity.outputs.app-slug }}
        run: |
          expected_actor="${APP_SLUG}[bot]"
          if [ "$ACTOR" != "$expected_actor" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' was pushed by unexpected actor '${ACTOR}' (expected '${expected_actor}'). Refusing to run privileged release-publish jobs."
            exit 1
          fi
          echo "Tag pushed by trusted actor '${ACTOR}' - proceeding."

  rover-ctl-base-image:
    name: Rover-CTL Base Image
    needs: guard
    # Runs unconditionally as a safety net, ensuring the base image is
    # always fresh before it's consumed by roverctl-combined-image below.
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    with:
      push: true
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: guard
    permissions:
      contents: write # to publish the GitHub release
      packages: write # to push module images to GHCR
    uses: ./.github/workflows/release-goreleaser.yaml
    secrets: inherit

  mirror-to-artifactory:
    name: "Mirror ${{ matrix.module }} to Artifactory"
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull images from GHCR via skopeo below
    strategy:
      fail-fast: false
      matrix:
        # Same module list as .goreleaser.yaml's `kos:` pipe, minus
        # rover-ctl (its combined bash/jq/yq image is mirrored separately by
        # roverctl-combined-image below).
        module:
          - admin
          - agentic
          - api
          - application
          - approval
          - common-server
          - controlplane-api
          - discovery-server
          - event
          - file-manager
          - gateway
          - identity
          - notification
          - organization
          - organization-server
          - permission
          - projector
          - pubsub
          - rover
          - rover-server
          - secret-manager
    steps:
      - name: Mirror release images to Artifactory
        # skopeo is pre-installed on ubuntu-latest - no setup action required,
        # and no `docker login` is needed either since skopeo takes creds
        # inline via --src-creds/--dest-creds below.
        # GoReleaser's kos pipe pushes all module images to GHCR with the
        # version tag, `latest`, and (for non-prereleases) `stable`.
        # This step copies each of those tags to Artifactory so the exact
        # same multi-arch manifest is available for internal deployments.
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
          MODULE: ${{ matrix.module }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_CONTROLPLANE_REPO: ${{ vars.REGISTRY_CONTROLPLANE_REPO }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
        run: |
          # GoReleaser always pushes `latest` and `v<version>`.
          # `stable` is only pushed for non-prereleases (no `-` in version).
          tags=("latest" "v${VERSION}")
          if [[ "${VERSION}" != *-* ]]; then
            tags+=("stable")
          fi

          src="ghcr.io/telekom/controlplane/${MODULE}"
          dst="${REGISTRY_HOST}/${REGISTRY_CONTROLPLANE_REPO}/${MODULE}"
          for tag in "${tags[@]}"; do
            echo "Mirroring ${src}:${tag} → ${dst}:${tag}"
            skopeo copy --all \
              --src-creds  "${GHCR_USER}:${GHCR_TOKEN}" \
              --dest-creds "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
              "docker://${src}:${tag}" \
              "docker://${dst}:${tag}"
          done

  roverctl-combined-image:
    name: Rover-CTL Combined Image (bash/jq/yq)
    needs: [rover-ctl-base-image, goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull the plain roverctl image from GHCR below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        # Needed so buildx can pull the ROVERCTL_IMAGE builder-stage image
        # (built by the goreleaser job above) as a build-arg base below.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Artifactory
        # Needed to push the final bash/jq/yq-bundled roverctl image. It's
        # not published to GHCR because it bundles GPL-3.0-or-later (bash,
        # readline) and GPL-2.0-only (Alpine base) components inherited from
        # the rover-ctl-base image built by the rover-ctl-base-image job
        # above.
        #
        # vars.REGISTRY_HOST must match the registry host used in
        # .github/workflows/rover-ctl-base-image.yaml.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push final roverctl image (bash/jq/yq + binary)
        # GoReleaser's `kos` pipe (run in the goreleaser job above) publishes
        # the plain roverctl binary image to GHCR (no GPL content). This
        # step layers that binary onto the Artifactory bash/jq/yq base image
        # (built by the rover-ctl-base-image job above) and pushes the
        # combined image to Artifactory - see rover-ctl/Dockerfile.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: rover-ctl
          push: true
          build-args: |
            ROVERCTL_IMAGE=ghcr.io/telekom/controlplane/rover-ctl:v${{ needs.goreleaser.outputs.version }}
            ROVERCTL_BASE_IMAGE=${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:${{ needs.goreleaser.outputs.version }}
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:latest

  release_summary:
    name: Release Publish Summary
    needs: [guard, rover-ctl-base-image, goreleaser, mirror-to-artifactory, roverctl-combined-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        shell: bash
        run: |
          {
            echo "Guard result: ${{ needs.guard.result }}"
            echo "Rover-CTL base image result: ${{ needs.rover-ctl-base-image.result }}"
            echo "GoReleaser result: ${{ needs.goreleaser.result }}"
            echo "Artifactory mirroring result: ${{ needs.mirror-to-artifactory.result }}"
            echo "Rover-CTL combined image result: ${{ needs.roverctl-combined-image.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=false
          for r in "${{ needs.guard.result }}" "${{ needs.rover-ctl-base-image.result }}" "${{ needs.goreleaser.result }}" "${{ needs.mirror-to-artifactory.result }}" "${{ needs.roverctl-combined-image.result }}"; do
            [ "$r" = "success" ] || fail=true
          done

          if $fail; then
            echo "::error::One or more release-publish jobs did not succeed"
            exit 1
          fi
