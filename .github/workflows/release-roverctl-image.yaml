# Builds the final roverctl image: layers the plain roverctl binary image
# (pushed to GHCR by release-goreleaser.yaml) onto the bash/jq/yq base image
# (built by rover-ctl-base-image.yaml) and pushes the result to Artifactory.
# Not published to GHCR because it bundles GPL-3.0-or-later (bash, readline)
# and GPL-2.0-only (Alpine base) components. Only invoked (via workflow_call)
# by release.yaml.
name: "Release Rover-CTL Combined Image"

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
      version:
        description: "Released version without leading 'v', e.g. 1.2.3"
        required: true
        type: string
    secrets:
      ARTIFACTORY_O28M_PUSH_USER:
        required: true
      ARTIFACTORY_O28M_PUSH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push roverctl image (bash/jq/yq)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull the plain roverctl image from GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Artifactory
        # vars.REGISTRY_HOST must match the registry host used in
        # rover-ctl-base-image.yaml.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push final roverctl image (bash/jq/yq + binary)
        # See rover-ctl/Dockerfile.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rover-ctl
          push: true
          build-args: |
            ROVERCTL_IMAGE=ghcr.io/telekom/controlplane/rover-ctl:v${{ inputs.version }}
            ROVERCTL_BASE_IMAGE=${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:${{ inputs.version }}
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:latest
