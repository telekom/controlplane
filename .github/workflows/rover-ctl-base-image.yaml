name: "Rover-CTL Base Image"

# Builds rover-ctl/Dockerfile.base (bash/jq/yq bundled alongside roverctl),
# optionally pushing it to the internal Artifactory Docker registry.
#
# Invoked (via workflow_call) by:
#   - release.yaml: on every release run from main, in parallel with
#     semantic-release.
#
# Also directly runnable via workflow_dispatch (Actions tab > "Rover-CTL Base
# Image" > Run workflow) for ad-hoc rebuilds (e.g. picking up a security
# patch with no Dockerfile.base diff).
#
# Published to Artifactory, not GHCR: rover-ctl-base bundles GPL-3.0-or-later
# (bash, readline) and GPL-2.0-only (Alpine base) components.
#
# NOTE: the registry host/path below must be kept identical to the
# `base_image` value on the rover-ctl entry in .goreleaser.yaml and to
# ci.yaml's `base_image` input (goreleaser's `kos` pipe does not support
# templating `base_image`, so .goreleaser.yaml hardcodes the same value):
#   - vars.REGISTRY_HOST             (internal Artifactory registry host)
#   - vars.REGISTRY_ROVERCTL_BASE_REPO (internal Artifactory repository path)
#   - vars.ROVERCTL_BASE_IMAGE_TAG    (e.g. bash-jq-yq-v1)
#
# NOTE: this is a different Artifactory repo/path than the final rover-ctl
# image published by release-roverctl-image.yaml (vars.REGISTRY_ROVERCTL_REPO)
# - the base image and final image live in unrelated repos, not a shared
# path prefix.
# TODO: create these repository variables (Settings > Secrets and variables
# > Actions > Variables) with the real Artifactory registry host/path.

on:
  workflow_call:
    inputs:
      push:
        description: "Push the base image to Artifactory"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: "Push the base image to Artifactory"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push rover-ctl base image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Artifactory
        # Referencing repo secrets directly (rather than declaring a
        # `secrets:` input block) works both when this workflow is run
        # standalone via workflow_dispatch, and when called via
        # workflow_call by a caller using `secrets: inherit`.
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret

      - name: Build and push rover-ctl base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rover-ctl
          file: rover-ctl/Dockerfile.base
          push: ${{ inputs.push }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:latest
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
