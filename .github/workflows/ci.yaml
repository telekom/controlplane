# Monorepo CI orchestrator. Per-module configuration lives in
# .github/ci/modules.yaml; the cross-module dependency graph used for
# "optimized" scoping lives in .github/ci/module-graph.json (generated by
# .github/scripts/gen-module-graph.sh from go.mod `replace` directives). See
# .github/workflows.md for the full strategy.
name: Run CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "CI scope: maximum (all modules), minimum (changed modules only), optimized (changed modules + their dependents)"
        required: false
        type: choice
        options:
          - maximum
          - minimum
          - optimized
        default: maximum
  push:
    branches:
      - "main"
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  packages: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-scope:
    name: Determine CI Scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      run_full: ${{ steps.scope.outputs.run_full }}
      build_modules: ${{ steps.scope.outputs.build_modules }}
      package_modules: ${{ steps.scope.outputs.package_modules }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine requested mode
        id: requested_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mode=optimized
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$DISPATCH_MODE"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            # Tags are created by the separate, manually-triggered
            # release.yaml workflow, which already builds/tests/publishes
            # everything via goreleaser+ko. Running the module CI again
            # here would just duplicate that work (and could push
            # conflicting image tags), so intentionally run nothing.
            mode=none
          else
            mode=maximum # push to main, schedule: full integration confidence
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Detect changed files
        id: changed_files
        # Not needed (and not meaningful - there's no base to diff
        # against, or the result is discarded anyway) once we already know
        # the effective scope regardless of changed files.
        if: ${{ steps.requested_mode.outputs.mode != 'maximum' && steps.requested_mode.outputs.mode != 'none' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            changed:
              - '**'

      - name: Compute CI scope
        id: scope
        shell: bash
        env:
          MODE: ${{ steps.requested_mode.outputs.mode }}
          CHANGED_FILES_JSON: ${{ steps.changed_files.outputs.changed_files || '[]' }}
        run: |
          result="$(jq -r '.[]' <<<"$CHANGED_FILES_JSON" | .github/scripts/select-scope.sh "$MODE")"
          echo "$result" | jq . # visible in the job log for debugging
          {
            echo "mode=$(jq -r .mode <<<"$result")"
            echo "run_full=$(jq -r .run_full <<<"$result")"
            echo "build_modules=$(jq -c .build_modules <<<"$result")"
            echo "package_modules=$(jq -c .package_modules <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CI Scope"
            echo "- mode: \`$(jq -r .mode <<<"$result")\`"
            echo "- build modules: $(jq -r '[.build_modules[].name] | join(", ")' <<<"$result")"
            echo "- package modules: $(jq -r '[.package_modules[].name] | join(", ")' <<<"$result")"
          } >> "$GITHUB_STEP_SUMMARY"

  check-module-graph:
    name: Check Module Dependency Graph
    needs: determine-scope
    # Skipped on tag pushes (mode=none): those intentionally run no module
    # CI at all (see determine-scope above), so an unrelated graph drift
    # shouldn't fail an otherwise no-op tag CI run.
    if: ${{ needs.determine-scope.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify .github/ci/module-graph.json is up to date
        # yq and jq are preinstalled on GitHub-hosted ubuntu runners.
        run: make ci-graph-check

  build:
    name: "Build (${{ matrix.name }})"
    needs: determine-scope
    if: ${{ fromJSON(needs.determine-scope.outputs.build_modules)[0] != null }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.determine-scope.outputs.build_modules) }}
    uses: ./.github/workflows/component-build.yaml
    with:
      name: ${{ matrix.name }}
      module: ${{ matrix.path }}
      run_check_generated_files: ${{ matrix.run_check_generated_files }}
      run_lint: ${{ matrix.run_lint }}
      lint_fail_on_issues: ${{ matrix.lint_fail_on_issues }}
      coverage_threshold: ${{ matrix.coverage_threshold }}

  collect_build_status:
    name: Collect Build Status
    needs: [determine-scope, build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      package_matrix: ${{ steps.compute.outputs.package_matrix }}
      rover_ctl_ready: ${{ steps.compute.outputs.rover_ctl_ready }}
    steps:
      # Matrix jobs don't expose per-item outputs to downstream jobs, so
      # component-build.yaml's report_status job leaves a per-module
      # success/failure marker artifact behind - collected here to compute
      # which modules are actually safe to package. This preserves the
      # same "one module's failure doesn't block another module's release"
      # isolation the previous one-job-per-module CI structure had.
      - name: Download build status markers
        if: ${{ fromJSON(needs.determine-scope.outputs.build_modules)[0] != null }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-status-*
          path: build-status
        continue-on-error: true

      - name: Compute package matrix
        id: compute
        shell: bash
        env:
          PACKAGE_MODULES_JSON: ${{ needs.determine-scope.outputs.package_modules }}
          BUILD_MODULES_JSON: ${{ needs.determine-scope.outputs.build_modules }}
        run: |
          succeeded="[]"
          if [ -d build-status ]; then
            # actions/download-artifact flattens the per-artifact subdirectory
            # structure whenever exactly one artifact matches the pattern
            # (regardless of merge-multiple), so a single in-scope module's
            # marker ends up at build-status/status.txt directly instead of
            # build-status/build-status-<name>/status.txt. Since we already
            # know every expected module name from determine-scope's output,
            # check both possible locations per module rather than trying to
            # discover names from the (possibly flattened) directory layout.
            names="$(jq -r '.[].name' <<<"$BUILD_MODULES_JSON")"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              val=false
              if [ -f "build-status/build-status-${name}/status.txt" ]; then
                val="$(cat "build-status/build-status-${name}/status.txt")"
              elif [ -f "build-status/status.txt" ]; then
                val="$(cat "build-status/status.txt")"
              fi
              if [ "$val" = "true" ]; then
                succeeded="$(jq -c --arg n "$name" '. + [$n]' <<<"$succeeded")"
              fi
            done <<<"$names"
          fi

          # Only modules that both (a) are in scope for packaging and (b)
          # just built successfully get their image (re)published.
          filtered="$(jq -c --argjson succeeded "$succeeded" '
            [ .[] | select(.name as $n | $succeeded | index($n) != null) ]
          ' <<<"$PACKAGE_MODULES_JSON")"

          # rover-ctl is packaged by a dedicated job (see rover_ctl_package
          # below) because its output feeds the combined bash/jq/yq image
          # job, which needs an individually addressable output - not
          # available for members of a generic matrix.
          package_matrix="$(jq -c '[ .[] | select(.name != "rover-ctl") ]' <<<"$filtered")"
          rover_ctl_ready="$(jq -c 'any(.[]; .name == "rover-ctl")' <<<"$filtered")"

          echo "package_matrix=$package_matrix" >> "$GITHUB_OUTPUT"
          echo "rover_ctl_ready=$rover_ctl_ready" >> "$GITHUB_OUTPUT"

  package:
    name: "Package (${{ matrix.name }})"
    needs: collect_build_status
    if: ${{ fromJSON(needs.collect_build_status.outputs.package_matrix)[0] != null }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.collect_build_status.outputs.package_matrix) }}
    uses: ./.github/workflows/component-package-build.yaml
    with:
      name: ${{ matrix.name }}
      module: ${{ matrix.path }}
      ko_build_path: ${{ matrix.ko_build_path }}

  common-server-helm:
    name: Common Server Helm Chart
    needs: package
    # `package` is legitimately "skipped" for tag pushes (mode=none, see
    # determine-scope) - release.yaml handles building/publishing there,
    # this job only needs to still publish the Helm chart for that tag.
    if: ${{ !cancelled() && (needs.package.result == 'success' || needs.package.result == 'skipped') && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/helm-release.yaml
    with:
      chart_path: 'common-server/helm'

  rover-ctl-base-image-changes:
    name: Detect rover-ctl base image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.rover_ctl_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for rover-ctl base image changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rover_ctl_base:
              - 'rover-ctl/Dockerfile.base'

  rover-ctl-base-image:
    name: Rover-CTL Base Image
    needs: rover-ctl-base-image-changes
    # Only rebuilds/pushes when rover-ctl/Dockerfile.base changed in this
    # push/PR (see rover-ctl-base-image-changes above); still runs
    # unconditionally in release.yaml.
    if: needs.rover-ctl-base-image-changes.outputs.changed == 'true'
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    secrets: inherit

  rover_ctl_package:
    name: "Package (rover-ctl)"
    needs: collect_build_status
    if: ${{ needs.collect_build_status.outputs.rover_ctl_ready == 'true' }}
    uses: ./.github/workflows/component-package-build.yaml
    with:
      name: rover-ctl
      module: rover-ctl
      # rover-ctl/Dockerfile copies the binary from a fixed path
      # (/ko-app/rover-ctl) in this image, which requires ko to resolve the
      # import path to the module directory name "rover-ctl" - "." achieves
      # that, unlike other modules' "cmd/main.go" style paths.
      #
      # This only builds/pushes the plain roverctl binary image to GHCR
      # (ko's default distroless base, no bash/jq/yq, no GPL content) - same
      # as every other module. The bash/jq/yq-bundled image published to the
      # internal Artifactory registry is assembled separately by the
      # rover-ctl-image job below, which layers this GHCR image's binary
      # onto the Artifactory base image (see rover-ctl/Dockerfile).
      ko_build_path: "."

  rover-ctl-image:
    name: Rover-CTL Combined Image (bash/jq/yq)
    needs: [rover_ctl_package, rover-ctl-base-image]
    # rover-ctl-base-image is conditionally skipped when Dockerfile.base
    # didn't change - by default a skipped `needs` job would also skip this
    # job, so explicitly allow proceeding when it was skipped, not just when
    # it succeeded.
    if: ${{ !cancelled() && needs.rover_ctl_package.result == 'success' && (needs.rover-ctl-base-image.result == 'success' || needs.rover-ctl-base-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inject slug vars
        uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        # Needed so buildx can pull the ROVERCTL_IMAGE builder-stage image
        # pushed by the rover_ctl_package job above, regardless of its visibility.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Artifactory
        # TODO: create vars.REGISTRY_HOST, vars.REGISTRY_ROVERCTL_REPO,
        # vars.REGISTRY_ROVERCTL_BASE_REPO, and vars.ROVERCTL_BASE_IMAGE_TAG
        # repository variables, plus the ARTIFACTORY_O28M_PUSH_USER/TOKEN
        # secrets referenced below.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret
      - name: Build and push combined roverctl image
        # Layers the plain roverctl binary (just built/pushed to GHCR by the
        # rover_ctl_package job above, referenced by immutable digest) onto the
        # Artifactory bash/jq/yq base image - see rover-ctl/Dockerfile.
        #
        # NOTE: the base image lives in a DIFFERENT Artifactory repo/path
        # (vars.REGISTRY_ROVERCTL_BASE_REPO) than this combined image
        # (vars.REGISTRY_ROVERCTL_REPO) - they are unrelated paths, not a
        # shared prefix with a suffix appended.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: rover-ctl
          push: true
          build-args: |
            ROVERCTL_IMAGE=${{ needs.rover_ctl_package.outputs.image_repository }}@${{ needs.rover_ctl_package.outputs.image_digest }}
            ROVERCTL_BASE_IMAGE=${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
          tags: ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:${{ env.GITHUB_HEAD_REF_SLUG || 'latest' }}

  ci_summary:
    name: CI Summary
    needs:
      - determine-scope
      - check-module-graph
      - build
      - collect_build_status
      - package
      - common-server-helm
      - rover-ctl-base-image
      - rover_ctl_package
      - rover-ctl-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize CI results
        shell: bash
        run: |
          {
            echo "CI mode: ${{ needs.determine-scope.result }} (${{ needs.determine-scope.outputs.mode }})"
            echo "Module graph check result: ${{ needs.check-module-graph.result }}"
            echo "Build result: ${{ needs.build.result }}"
            echo "Collect build status result: ${{ needs.collect_build_status.result }}"
            echo "Package result: ${{ needs.package.result }}"
            echo "Common Server Helm Chart result: ${{ needs.common-server-helm.result }}"
            echo "Rover-CTL base image result: ${{ needs.rover-ctl-base-image.result }}"
            echo "Rover-CTL package result: ${{ needs.rover_ctl_package.result }}"
            echo "Rover-CTL combined image result: ${{ needs.rover-ctl-image.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=false
          [ "${{ needs.determine-scope.result }}" = "success" ] || fail=true
          # check-module-graph is legitimately "skipped" on tag pushes
          # (mode=none), which intentionally run no module CI at all.
          for r in "${{ needs.check-module-graph.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || fail=true
          done
          # build/package are legitimately "skipped" whenever their computed
          # matrix is empty (e.g. a docs-only PR touches no Go module).
          for r in "${{ needs.build.result }}" "${{ needs.collect_build_status.result }}" "${{ needs.package.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || fail=true
          done
          for r in "${{ needs.common-server-helm.result }}" "${{ needs.rover-ctl-base-image.result }}" "${{ needs.rover_ctl_package.result }}" "${{ needs.rover-ctl-image.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || fail=true
          done

          if $fail; then
            echo "::error::One or more required CI jobs did not succeed"
            exit 1
          fi

  projector:
    name: Projector
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: projector
      module: projector
      run_check_generated_files: false
      ko_build_path: "main.go"

  permission:
    name: Permission
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: permission
      module: permission
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 66
      lint_fail_on_issues: true

  sftp:
    name: SFTP
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: sftp
      module: sftp
      run_check_generated_files: true
      ko_build_path: "cmd/sftp-operator/main.go"
      coverage_threshold: 66
      lint_fail_on_issues: true

  file:
    name: File
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: file
      module: file
      run_check_generated_files: true
      ko_build_path: "cmd/file-operator/main.go"
      lint_fail_on_issues: true
