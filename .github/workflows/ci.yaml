name: Run CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  packages: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs: 
  common:
    name: Common
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: common
      module: common
      run_check_generated_files: false
      run_build_image: false
      coverage_threshold: 55
      lint_fail_on_issues: true

  common-server:
    name: Common Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: common-server
      module: common-server
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      
  common-server-helm:
    name: Common Server Helm Chart
    needs: common-server
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/helm-release.yaml
    with: 
      chart_path: 'common-server/helm'

  controlplane-api:
    name: ControlPlane API
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: controlplane-api
      module: controlplane-api
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      coverage_threshold: 1

  secret-manager:
    name: Secret Manager
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: secret-manager
      module: secret-manager
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      coverage_threshold: 50

  approval:
    name: Approval
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: approval
      module: approval
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  file-manager:
    name: File Manager
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: file-manager
      module: file-manager
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      coverage_threshold: 61
      lint_fail_on_issues: true

  gateway:
    name: Gateway
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: gateway
      module: gateway
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 56

  identity:
    name: Identity
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: identity
      module: identity
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  organization:
    name: Organization
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: organization
      module: organization
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  admin:
    name: Admin
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: admin
      module: admin
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  application:
    name: Application
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: application
      module: application
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  api:
    name: Api
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: api
      module: api
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  rover:
    name: Rover
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover
      module: rover
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 66

  rover-server:
    name: Rover-Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover-server
      module: rover-server
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      coverage_threshold: 41

  rover-ctl-base-image-changes:
    name: Detect rover-ctl base image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.rover_ctl_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check for rover-ctl base image changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            rover_ctl_base:
              - 'rover-ctl/Dockerfile.base'

  rover-ctl-base-image:
    name: Rover-CTL Base Image
    needs: rover-ctl-base-image-changes
    # Only rebuilds/pushes when rover-ctl/Dockerfile.base changed in this
    # push/PR (see rover-ctl-base-image-changes above); still runs
    # unconditionally in release.yaml.
    if: needs.rover-ctl-base-image-changes.outputs.changed == 'true'
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    secrets: inherit

  rover-ctl:
    name: Rover-CTL
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover-ctl
      module: rover-ctl
      run_check_generated_files: false
      ko_build_path: "main.go"
      # This only builds/pushes the plain roverctl binary image to GHCR
      # (ko's default distroless base, no bash/jq/yq, no GPL content) - same
      # as every other module. The bash/jq/yq-bundled image published to the
      # internal Artifactory registry is assembled separately by the
      # rover-ctl-image job below, which layers this GHCR image's binary
      # onto the Artifactory base image (see rover-ctl/Dockerfile).

  rover-ctl-image:
    name: Rover-CTL Combined Image (bash/jq/yq)
    needs: [rover-ctl, rover-ctl-base-image]
    # rover-ctl-base-image is conditionally skipped when Dockerfile.base
    # didn't change - by default a skipped `needs` job would also skip this
    # job, so explicitly allow proceeding when it was skipped, not just when
    # it succeeded.
    if: ${{ !cancelled() && needs.rover-ctl.result == 'success' && (needs.rover-ctl-base-image.result == 'success' || needs.rover-ctl-base-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inject slug vars
        uses: rlespinasse/github-slug-action@e6f261660910b273384c5c42b17a0217881b217a # v5.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Log in to GHCR
        # Needed so buildx can pull the ROVERCTL_IMAGE builder-stage image
        # pushed by the rover-ctl job above, regardless of its visibility.
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Artifactory
        # TODO: create vars.REGISTRY_HOST, vars.REGISTRY_ROVERCTL_REPO,
        # vars.REGISTRY_ROVERCTL_BASE_REPO, and vars.ROVERCTL_BASE_IMAGE_TAG
        # repository variables, plus the ARTIFACTORY_O28M_PUSH_USER/TOKEN
        # secrets referenced below.
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret
      - name: Build and push combined roverctl image
        # Layers the plain roverctl binary (just built/pushed to GHCR by the
        # rover-ctl job above, referenced by immutable digest) onto the
        # Artifactory bash/jq/yq base image - see rover-ctl/Dockerfile.
        #
        # NOTE: the base image lives in a DIFFERENT Artifactory repo/path
        # (vars.REGISTRY_ROVERCTL_BASE_REPO) than this combined image
        # (vars.REGISTRY_ROVERCTL_REPO) - they are unrelated paths, not a
        # shared prefix with a suffix appended.
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: rover-ctl
          push: true
          build-args: |
            ROVERCTL_IMAGE=${{ needs.rover-ctl.outputs.image_repository }}@${{ needs.rover-ctl.outputs.image_digest }}
            ROVERCTL_BASE_IMAGE=${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
          tags: ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:${{ env.GITHUB_HEAD_REF_SLUG || 'latest' }}

  snapshotter:
    name: Snapshotter
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: tools-snapshotter
      module: tools/snapshotter
      run_check_generated_files: false
      run_lint: false
      ko_build_path: "main.go"
      coverage_threshold: 3

  notification:
    name: Notification
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: notification
      module: notification
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  event:
    name: Event
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: event
      module: event
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  discovery-server:
    name: Discovery Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: discovery-server
      module: discovery-server
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  pubsub:
    name: PubSub
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: pubsub
      module: pubsub
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  projector:
    name: Projector
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: projector
      module: projector
      run_check_generated_files: false
      ko_build_path: "main.go"

  permission:
    name: Permission
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: permission
      module: permission
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 66
      lint_fail_on_issues: true