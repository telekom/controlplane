name: Run CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  packages: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs: 
  common:
    name: Common
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: common
      module: common
      run_check_generated_files: false
      run_build_image: false
      coverage_threshold: 55
      lint_fail_on_issues: true

  common-server:
    name: Common Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: common-server
      module: common-server
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      
  common-server-helm:
    name: Common Server Helm Chart
    needs: common-server
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/helm-release.yaml
    with: 
      chart_path: 'common-server/helm'

  controlplane-api:
    name: ControlPlane API
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: controlplane-api
      module: controlplane-api
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      coverage_threshold: 1

  secret-manager:
    name: Secret Manager
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: secret-manager
      module: secret-manager
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      coverage_threshold: 50

  approval:
    name: Approval
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: approval
      module: approval
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  file-manager:
    name: File Manager
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: file-manager
      module: file-manager
      run_check_generated_files: false
      ko_build_path: "cmd/server/server.go"
      coverage_threshold: 61
      lint_fail_on_issues: true

  gateway:
    name: Gateway
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: gateway
      module: gateway
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 56

  identity:
    name: Identity
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: identity
      module: identity
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  organization:
    name: Organization
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: organization
      module: organization
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  admin:
    name: Admin
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: admin
      module: admin
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  application:
    name: Application
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: application
      module: application
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  api:
    name: Api
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: api
      module: api
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  rover:
    name: Rover
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover
      module: rover
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 66

  rover-server:
    name: Rover-Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover-server
      module: rover-server
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      coverage_threshold: 41

  rover-ctl-base-image:
    name: Rover-CTL Base Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e6e46e4699d4f9c68c3f9ba0be2e6f4a6b03bfe4 # v3.11.1
      - name: Log in to Artifactory
        # rover-ctl-base bundles GPL-3.0-or-later (bash, readline) and
        # GPL-2.0-only (Alpine base) components, so it is published to the
        # internal Artifactory registry, not GHCR. See
        # openspec/changes/add-roverctl-image-cli-tools/license-findings.md.
        # Built here - decoupled from the full release cycle in
        # release.yaml (which only runs on manual workflow_dispatch) - so
        # every CI run always has a base image to pull, instead of
        # depending on a real release having happened first.
        # TODO: confirm the real Artifactory registry host/path.
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.6.0
        with:
          registry: artifactory.devops.telekom.de
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      - name: Build and push rover-ctl base image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47141f2ba9 # v6.18.0
        with:
          context: rover-ctl
          file: rover-ctl/Dockerfile.base
          push: true
          tags: |
            artifactory.devops.telekom.de/tardis-oci-local/tardis/customer/roverctl/rover-ctl-base:latest
            artifactory.devops.telekom.de/tardis-oci-local/tardis/customer/roverctl/rover-ctl-base:bash-jq-yq-v1

  rover-ctl:
    name: Rover-CTL
    needs: rover-ctl-base-image
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: rover-ctl
      module: rover-ctl
      run_check_generated_files: false
      ko_build_path: "main.go"
      # rover-ctl's release image bundles bash/jq/yq via a custom base image
      # containing GPL-3.0-or-later (bash, readline) and GPL-2.0-only
      # (Alpine base) components, so CI must build/scan/push it the same way
      # as the release pipeline: against the internal Artifactory registry,
      # not GHCR. See openspec/changes/add-roverctl-image-cli-tools/license-findings.md
      # and the `rover-ctl` kos entry in .goreleaser.yaml, which this must be
      # kept in sync with.
      # TODO: confirm the real Artifactory registry host/path (see open
      # question on repository-path vs. subdomain/port method).
      container_registry: artifactory.devops.telekom.de/tardis-oci-local/tardis/customer/roverctl
      base_image: artifactory.devops.telekom.de/tardis-oci-local/tardis/customer/roverctl/rover-ctl-base:bash-jq-yq-v1
    secrets:
      registry_username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
      registry_password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret

  snapshotter:
    name: Snapshotter
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: tools-snapshotter
      module: tools/snapshotter
      run_check_generated_files: false
      run_lint: false
      ko_build_path: "main.go"
      coverage_threshold: 3

  notification:
    name: Notification
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: notification
      module: notification
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  event:
    name: Event
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: event
      module: event
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  discovery-server:
    name: Discovery Server
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: discovery-server
      module: discovery-server
      run_check_generated_files: false
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  pubsub:
    name: PubSub
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: pubsub
      module: pubsub
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      lint_fail_on_issues: true

  projector:
    name: Projector
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: projector
      module: projector
      run_check_generated_files: false
      ko_build_path: "main.go"

  permission:
    name: Permission
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      name: permission
      module: permission
      run_check_generated_files: true
      ko_build_path: "cmd/main.go"
      coverage_threshold: 66
      lint_fail_on_issues: true