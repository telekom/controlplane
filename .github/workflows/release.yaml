name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rover-ctl-base-image:
    name: Rover-CTL Base Image
    # Runs unconditionally as a safety net, ensuring the base image is
    # always fresh before a release.
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    secrets: inherit

  release:
    needs: rover-ctl-base-image
    runs-on: ubuntu-latest
    permissions:
      packages: write # to be able to publish packages
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Artifactory
        # Needed to push the final bash/jq/yq-bundled roverctl image (built
        # below via docker buildx from rover-ctl/Dockerfile). It's not
        # published to GHCR because it bundles GPL-3.0-or-later (bash,
        # readline) and GPL-2.0-only (Alpine base) components inherited from
        # the rover-ctl-base image built by the rover-ctl-base-image job
        # above.
        #
        # vars.REGISTRY_HOST must match the registry host used below and in
        # .github/workflows/rover-ctl-base-image.yaml.
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Run GoReleaser
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --release-notes /tmp/release-notes.md --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror release images to Artifactory
        # skopeo is pre-installed on ubuntu-latest — no setup action required.
        # GoReleaser's kos pipe pushes all module images to GHCR with the
        # version tag, `latest`, and (for non-prereleases) `stable`.
        # This step copies each of those tags to Artifactory so the exact
        # same multi-arch manifest is available for internal deployments.
        # rover-ctl is excluded: its combined (bash/jq/yq) image is
        # assembled and pushed to Artifactory separately below.
        if: steps.semantic_release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic_release.outputs.new_release_version }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_CONTROLPLANE_REPO: ${{ vars.REGISTRY_CONTROLPLANE_REPO }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
        run: |
          modules=(
            admin agentic api application approval common-server
            controlplane-api discovery-server event file-manager gateway
            identity notification organization organization-server permission
            projector pubsub rover rover-server secret-manager
          )

          # Goreleaser always pushes `latest` and `v<version>`.
          # `stable` is only pushed for non-prereleases (no `-` in version).
          tags=("latest" "v${VERSION}")
          if [[ "${VERSION}" != *-* ]]; then
            tags+=("stable")
          fi

          for module in "${modules[@]}"; do
            src="ghcr.io/telekom/controlplane/${module}"
            dst="${REGISTRY_HOST}/${REGISTRY_CONTROLPLANE_REPO}/${module}"
            for tag in "${tags[@]}"; do
              echo "Mirroring ${src}:${tag} → ${dst}:${tag}"
              skopeo copy --all \
                --src-creds  "${GHCR_USER}:${GHCR_TOKEN}" \
                --dest-creds "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
                "docker://${src}:${tag}" \
                "docker://${dst}:${tag}"
            done
          done
      - name: Set up Docker Buildx
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push final roverctl image (bash/jq/yq + binary)
        # GoReleaser's `kos` pipe (run above) publishes the plain roverctl
        # binary image to GHCR (no GPL content). This step layers that
        # binary onto the Artifactory bash/jq/yq base image (built by the
        # rover-ctl-base-image job above) and pushes the combined image to
        # Artifactory - see rover-ctl/Dockerfile.
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: rover-ctl
          push: true
          build-args: |
            ROVERCTL_IMAGE=ghcr.io/telekom/controlplane/rover-ctl:v${{ steps.semantic_release.outputs.new_release_version }}
            ROVERCTL_BASE_IMAGE=${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_BASE_REPO }}:${{ vars.ROVERCTL_BASE_IMAGE_TAG }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:${{ steps.semantic_release.outputs.new_release_version }}
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_ROVERCTL_REPO }}:latest