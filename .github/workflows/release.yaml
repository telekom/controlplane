# Cuts a new release: runs semantic-release to analyze commits since the
# last tag, bump the version-reference files (kustomize overlay ref, Helm
# chart version), commit+push that to the release branch, and create+push
# the resulting `v*` git tag - see .releaserc.mjs for why the version-bump
# commit is pushed to the branch (tag/branch reachability for the next
# release run), and why no CHANGELOG.md is committed (GoReleaser generates
# the changelog as the GitHub Release body instead, in release-publish.yaml).
#
# Intentionally does nothing else. Building/publishing images, mirroring to
# Artifactory, and assembling the combined roverctl image all happen in
# release-publish.yaml, triggered by the tag push below - that keeps those
# steps independently re-runnable (via Actions' "Re-run failed jobs") without
# re-invoking semantic-release, and keeps this workflow fast and low-risk.
#
# The tag is pushed using a GitHub App installation token (not the default
# GITHUB_TOKEN) specifically so that push triggers release-publish.yaml -
# pushes made with GITHUB_TOKEN do not trigger other workflows.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release commit/tag
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # @semantic-release/commit-analyzer is bundled with semantic-release
          # itself; only @semantic-release/exec and @semantic-release/git need
          # installing. Neither @semantic-release/changelog nor
          # @semantic-release/release-notes-generator is used - see
          # .releaserc.mjs for why.
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
