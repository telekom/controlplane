# Release orchestrator - the only entry point of the release process. Same
# pattern as ci.yaml: each stage lives in its own reusable (workflow_call
# only) workflow and is wired together here via job `needs`.
#
#   release ──▶ goreleaser ──┬──▶ mirror-to-artifactory (matrix, one job per module)
#                            └──▶ roverctl-combined-image
#   rover-ctl-base-image ───────▶ roverctl-combined-image
#
# Every stage is a separate job, so a failed stage (e.g. one module's
# Artifactory mirroring) can be retried via "Re-run failed jobs" without
# re-running semantic-release or any stage that already succeeded.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rover-ctl-base-image:
    name: Rover-CTL Base Image
    # Runs unconditionally as a safety net, ensuring the base image is
    # always fresh before a release.
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    with:
      push: true
    secrets: inherit

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release commit and tag
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    outputs:
      published: ${{ steps.semantic_release.outputs.new_release_published }}
      tag: ${{ steps.semantic_release.outputs.new_release_git_tag }}
      version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Upload release notes
        # Written by .releaserc.mjs's publishCmd; consumed by the goreleaser
        # job as the GitHub Release body. Stored as an artifact (rather than
        # a job output) so it survives re-runs of downstream jobs.
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: /tmp/release-notes.md
          if-no-files-found: error

  goreleaser:
    name: GoReleaser
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # to publish the GitHub release
      packages: write # to push module images to GHCR
    uses: ./.github/workflows/release-goreleaser.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  mirror-to-artifactory:
    name: Mirror to Artifactory
    needs: [release, goreleaser]
    permissions:
      contents: read
      packages: read # to pull images from GHCR
    uses: ./.github/workflows/release-mirror.yaml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  roverctl-combined-image:
    name: Rover-CTL Combined Image
    needs: [release, rover-ctl-base-image, goreleaser]
    permissions:
      contents: read
      packages: read # to pull the plain roverctl image from GHCR
    uses: ./.github/workflows/release-roverctl-image.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
