name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rover-ctl-base-image:
    name: Rover-CTL Base Image
    # Unconditional (unlike ci.yaml's path-filtered job): release runs are
    # already manual/infrequent, so rebuilding here isn't wasteful, and this
    # acts as a safety net ensuring the base image is always fresh before a
    # real release, regardless of whether ci.yaml's change-detection ran on
    # the exact commit being released.
    uses: ./.github/workflows/rover-ctl-base-image.yaml
    secrets: inherit

  release:
    needs: rover-ctl-base-image
    runs-on: ubuntu-latest
    permissions:
      packages: write # to be able to publish packages
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Artifactory
        # The rover-ctl-base image itself is built/pushed by the
        # rover-ctl-base-image job above. This login is still needed here
        # because goreleaser's `kos` pipe also pushes the final rover-ctl
        # image to Artifactory (see the `rover-ctl` entry in
        # .goreleaser.yaml) - it bundles the same GPL-3.0-or-later (bash,
        # readline) and GPL-2.0-only (Alpine base) components, so it can't
        # be published to GHCR either.
        #
        # vars.REGISTRY_HOST must match the `repositories`/`base_image`
        # values hardcoded in .goreleaser.yaml (which can't read repo vars -
        # see the comment there).
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }} # TODO: create this secret
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }} # TODO: create this secret
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Run GoReleaser
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --release-notes /tmp/release-notes.md --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}